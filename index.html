<style>
  :root{
  /* ---- Design tokens ---- */

  /* sky */
  --sky-top:       #141d3d;
  --sky-mid:       #33475a;
  --sky-horizon:   #4a7c59;
  --sky-horizon2:  #7fa66b;

  /* silhouettes */
  --silhouette:    #121a2e;
  --silhouette-2:  #1c2740;

  /* canopy */
  --canopy:        #f2e8d5;
  --canopy-shadow: #c9b892;

  /* terrace */
  --terrace:       #0f1626;

  /* romantic accents */
  --sage:          #8fae6b;
  --blush:         #d18b82;
  --warm:          #e3b873;

  /* text */
  --ink:           #f4efe3;
  --ink-dim:       rgba(244,239,227,0.62);

  /* vegetation */
  --tree-1:        #0e1c16;
  --tree-2:        #17301f;
  --tree-3:        #234229;
  --trunk:         #14100c;

  /* distant city */
  --city:          #29385c;
  --city-light:    #ffd873;

  /* lamps */
  --lamp-yellow:   #ffcf4d;
}

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--sky-top);
    overflow:hidden;
  }

  body{
    font-family:'Jost', sans-serif;
    color:var(--ink);
    position:relative;
  }

  /* prefers-reduced-motion respected globally */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- Sky ---------- */

  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;

    background:
      radial-gradient(
        110% 65% at 50% 100%,
        var(--sky-horizon2) 0%,
        rgba(127,166,107,.55) 25%,
        transparent 62%
      ),
      linear-gradient(
        180deg,
        var(--sky-top) 0%,
        #1d2948 28%,
        var(--sky-mid) 52%,
        var(--sky-horizon) 82%,
        var(--sky-horizon2) 100%
      );
  }

  /* Main dense star field */
  .sky::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

      radial-gradient(4.5px 4.5px at 63% 20%, rgba(255,255,255,.96) 0%, rgba(255,255,255,.76) 35%, transparent 70%),
      radial-gradient(5px 5px at 75% 7%, rgba(255,242,214,.98) 0%, rgba(255,242,214,.82) 35%, transparent 70%),
      radial-gradient(4px 4px at 87% 23%, rgba(255,255,255,.94) 0%, rgba(255,255,255,.72) 35%, transparent 70%),
      radial-gradient(4.5px 4.5px at 96% 11%, rgba(255,247,224,.98) 0%, rgba(255,247,224,.8) 35%, transparent 70%),

      /* ===== MEDIUM STARS ===== */
      radial-gradient(3px 3px at 3% 29%, rgba(255,255,255,.92) 0%, transparent 68%),
      radial-gradient(2.8px 2.8px at 10% 37%, rgba(255,244,220,.82) 0%, transparent 68%),
      radial-gradient(3.2px 3.2px at 13% 6%, rgba(255,255,255,.9) 0%, transparent 68%),
      radial-gradient(2.6px 2.6px at 21% 32%, rgba(255,255,255,.84) 0%, transparent 68%),
      radial-gradient(3px 3px at 24% 17%, rgba(255,244,220,.88) 0%, transparent 68%),
      radial-gradient(2.7px 2.7px at 32% 38%, rgba(255,255,255,.78) 0%, transparent 68%),
      radial-gradient(3px 3px at 35% 15%, rgba(255,244,220,.86) 0%, transparent 68%),
      radial-gradient(2.8px 2.8px at 42% 5%, rgba(255,255,255,.84) 0%, transparent 68%),
      radial-gradient(3px 3px at 46% 34%, rgba(255,244,220,.88) 0%, transparent 68%),
      radial-gradient(2.7px 2.7px at 54% 27%, rgba(255,255,255,.82) 0%, transparent 68%),
      radial-gradient(3px 3px at 58% 8%, rgba(255,244,220,.9) 0%, transparent 68%),
      radial-gradient(2.8px 2.8px at 67% 35%, rgba(255,255,255,.84) 0%, transparent 68%),
      radial-gradient(3.1px 3.1px at 72% 17%, rgba(255,244,220,.88) 0%, transparent 68%),
      radial-gradient(2.6px 2.6px at 79% 31%, rgba(255,255,255,.8) 0%, transparent 68%),
      radial-gradient(3px 3px at 84% 14%, rgba(255,244,220,.86) 0%, transparent 68%),
      radial-gradient(2.8px 2.8px at 91% 36%, rgba(255,255,255,.82) 0%, transparent 68%),
      radial-gradient(3px 3px at 97% 26%, rgba(255,244,220,.88) 0%, transparent 68%),

      /* ===== SMALL STARS ===== */
      radial-gradient(2px 2px at 2% 16%, rgba(255,255,255,.78) 0%, transparent 65%),
      radial-gradient(2px 2px at 7% 46%, rgba(255,244,220,.7) 0%, transparent 65%),
      radial-gradient(2.2px 2.2px at 11% 14%, rgba(255,255,255,.76) 0%, transparent 65%),
      radial-gradient(1.8px 1.8px at 18% 5%, rgba(255,255,255,.7) 0%, transparent 65%),
      radial-gradient(2px 2px at 20% 43%, rgba(255,244,220,.68) 0%, transparent 65%),
      radial-gradient(2.1px 2.1px at 28% 28%, rgba(255,255,255,.74) 0%, transparent 65%),
      radial-gradient(2px 2px at 34% 7%, rgba(255,244,220,.72) 0%, transparent 65%),
      radial-gradient(2.2px 2.2px at 40% 42%, rgba(255,255,255,.7) 0%, transparent 65%),
      radial-gradient(2px 2px at 48% 19%, rgba(255,244,220,.74) 0%, transparent 65%),
      radial-gradient(2.1px 2.1px at 52% 39%, rgba(255,255,255,.7) 0%, transparent 65%),
      radial-gradient(2px 2px at 60% 31%, rgba(255,244,220,.72) 0%, transparent 65%),
      radial-gradient(2.2px 2.2px at 65% 4%, rgba(255,255,255,.76) 0%, transparent 65%),
      radial-gradient(2px 2px at 70% 43%, rgba(255,244,220,.68) 0%, transparent 65%),
      radial-gradient(2.1px 2.1px at 77% 25%, rgba(255,255,255,.72) 0%, transparent 65%),
      radial-gradient(2px 2px at 82% 39%, rgba(255,244,220,.72) 0%, transparent 65%),
      radial-gradient(2.2px 2.2px at 89% 5%, rgba(255,255,255,.76) 0%, transparent 65%),
      radial-gradient(2px 2px at 94% 43%, rgba(255,244,220,.7) 0%, transparent 65%),

      radial-gradient(1.5px 1.5px at 9% 25%, rgba(255,255,255,.58) 0%, transparent 60%),
      radial-gradient(1.4px 1.4px at 15% 41%, rgba(255,244,220,.6) 0%, transparent 60%),
      radial-gradient(1.6px 1.6px at 23% 12%, rgba(255,255,255,.64) 0%, transparent 60%),
      radial-gradient(1.4px 1.4px at 30% 45%, rgba(255,244,220,.56) 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 37% 21%, rgba(255,255,255,.6) 0%, transparent 60%),

  /* Additional scattered stars */
  .sky::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background-image:
      radial-gradient(2.4px 2.4px at 5% 55%, rgba(255,255,255,.7) 0%, transparent 65%),
      radial-gradient(2px 2px at 12% 62%, rgba(255,244,220,.66) 0%, transparent 65%),
      radial-gradient(2.6px 2.6px at 19% 52%, rgba(255,255,255,.72) 0%, transparent 65%),

      radial-gradient(2.5px 2.5px at 34% 57%, rgba(255,255,255,.68) 0%, transparent 65%),
      radial-gradient(2.2px 2.2px at 42% 64%, rgba(255,244,220,.64) 0%, transparent 65%),
      radial-gradient(2.5px 2.5px at 50% 53%, rgba(255,255,255,.7) 0%, transparent 65%),
      radial-gradient(2px 2px at 57% 70%, rgba(255,244,220,.62) 0%, transparent 65%),

      radial-gradient(2.5px 2.5px at 96% 55%, rgba(255,255,255,.68) 0%, transparent 65%);

    animation:star-field-slow 13s ease-in-out infinite alternate-reverse;
  }

  @keyframes star-field{
    from{
      opacity:.88;
    }
    to{
      opacity:1;
    }
  }

  @keyframes star-field-slow{
    from{
      opacity:.58;
    }
    to{
      opacity:.82;
    }
  }

  /* ---------- Particles (fireflies) ---------- */
  #particles-bg{
    position:fixed;
    inset:0;
    z-index:2.5;
    pointer-events:none;
    opacity:0;
  }

  #fireflies{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  /* ---------- Scene (SVG) ---------- */
  .scene-wrap{
    position:fixed; inset:0; z-index:2;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .scene{
    width:100%; height:100%;
    display:block;
  }

  #layer-buildings{ opacity:.9; }
  #layer-trees{ opacity:.95; }
  #layer-canopy path{ transition:none; }
  #layer-terrace{ opacity:1; }

  .glow{
    filter:drop-shadow(0 0 26px rgba(227,184,115,0.35));
  }

  /* ---------- Content ---------- */
  .content{
    position:fixed;
    inset:0;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:clamp(6vh, 9vh, 12vh) 24px 0;
    pointer-events:none;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--sage);
    opacity:0;
    margin-bottom:18px;
  }

  .countdown{
    display:flex;
    align-items:flex-start;
    gap:clamp(10px, 3vw, 34px);
    margin-bottom:22px;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:clamp(58px, 7vw, 82px);
    opacity:0;
  }

  .unit .num{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:clamp(44px, 8vw, 88px);
    line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.025em;
    text-shadow:0 0 40px rgba(227,184,115,0.16);
  }

  .unit .label{
    display:block;
    margin-top:12px;
    font-size:9px;
    line-height:1.2;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ink-dim);
    opacity:.8;
    white-space:nowrap;
  }

  .colon{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(24px, 5vw, 48px);
    font-weight:400;
    color:var(--ink-dim);
    align-self:center;
    transform:translateY(-8px);
    opacity:0;
  }

  .date-line{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(21px, 3vw, 31px);
    color:var(--canopy);
    opacity:0;
    letter-spacing:.015em;
  }

  .caption{
    margin-top:12px;
    font-size:13px;
    letter-spacing:.05em;
    color:var(--ink-dim);
    opacity:0;
    max-width:340px;
  }

  .name-line{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(27px, 4vw, 42px);
    font-weight:500;
    color:var(--canopy);
    letter-spacing:.02em;
    margin-bottom:18px;
    opacity:0;
  }

  @media (max-width:480px){
    .countdown{ gap:10px; }
    .colon{ display:none; }
  }
</style>
</head>

<!-- tsParticles (fireflies) -->
<!-- <script src="https://cdn.jsdelivr.net/npm/tsparticles@4/tsparticles.bundle.min.js"></script> -->

<script>
/* =========================================================
   CONFIG — edit these two lines
   ========================================================= */
const TARGET_DATE = new Date("2026-09-26T18:00:00+08:00"); // Manila time
const CAPTION_TEXT = "meet me at the garden.";
/* ========================================================= */

document.getElementById('caption').textContent = CAPTION_TEXT;

/* ---------- Fireflies: native canvas ---------- */

const canvas = document.getElementById("fireflies");
const ctx = canvas.getContext("2d");

let fireflies = [];
let canvasWidth = 0;
let canvasHeight = 0;
let lastTime = performance.now();

function resizeFireflies() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvasWidth = window.innerWidth;
  canvasHeight = window.innerHeight;

  canvas.width = canvasWidth * dpr;
  canvas.height = canvasHeight * dpr;

  canvas.style.width = `${canvasWidth}px`;
  canvas.style.height = `${canvasHeight}px`;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  createFireflies();
}

function createFireflies() {
  fireflies = [];

  const count = Math.min(
    70,
    Math.max(35, Math.floor((canvasWidth * canvasHeight) / 18000))
  );

  for (let i = 0; i < count; i++) {
    fireflies.push({
      x: Math.random() * canvasWidth,
      y: canvasHeight * (0.48 + Math.random() * 0.38),

      radius: 2.2 + Math.random() * 2.8,

      baseAlpha: 0.45 + Math.random() * 0.45,
      phase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.7 + Math.random() * 1.2,

      driftX: (Math.random() - 0.5) * 0.18,
      driftY: (Math.random() - 0.5) * 0.12,

      color: Math.random() > 0.7
        ? "255,244,218"
        : "227,184,115"
    });
  }
}

function animateFireflies(now) {
  const delta = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;

  ctx.clearRect(0, 0, canvasWidth, canvasHeight);

  fireflies.forEach((f) => {
    f.phase += 0.01 * f.pulseSpeed * delta;

    f.x += f.driftX * delta;
    f.y += f.driftY * delta;

    /* gentle wandering */
    f.x += Math.sin(f.phase * 0.7) * 0.08 * delta;
    f.y += Math.cos(f.phase * 0.55) * 0.07 * delta;

    /* wrap around edges */
    if (f.x < -20) f.x = canvasWidth + 20;
    if (f.x > canvasWidth + 20) f.x = -20;

    const gardenTop = canvasHeight * 0.52;
    const gardenBottom = canvasHeight * 0.87;

    if (f.y < gardenTop) {
      f.y = gardenBottom;
    }

    if (f.y > gardenBottom) {
      f.y = gardenTop;
    }

    const pulse =
      0.55 +
      0.45 * Math.sin(f.phase);

    const alpha = f.baseAlpha * pulse;

    /* outer glow */
    const glow = ctx.createRadialGradient(
      f.x,
      f.y,
      0,
      f.x,
      f.y,
      f.radius * 5
    );

    glow.addColorStop(
      0,
      `rgba(${f.color}, ${alpha * 0.55})`
    );

    glow.addColorStop(
      0.35,
      `rgba(${f.color}, ${alpha * 0.22})`
    );

    glow.addColorStop(
      1,
      `rgba(${f.color}, 0)`
    );

    ctx.fillStyle = glow;

    ctx.beginPath();
    ctx.arc(
      f.x,
      f.y,
      f.radius * 5,
      0,
      Math.PI * 2
    );
    ctx.fill();

    /* bright core */
    ctx.fillStyle = `rgba(255,248,225,${alpha})`;

    ctx.beginPath();
    ctx.arc(
      f.x,
      f.y,
      f.radius,
      0,
      Math.PI * 2
    );
    ctx.fill();
  });

  requestAnimationFrame(animateFireflies);
}

window.addEventListener("resize", resizeFireflies);

resizeFireflies();

/* ---------- GSAP: entrance timeline ---------- */

  "#layer-moon",

  "#layer-distant-trunks",

  "#layer-tree-trunks", 
  "#layer-trees", 
  "#layer-bushes", 
  "#layer-lamps", 
  "#layer-palms", 
  "#layer-canopy", 
  "#layer-canopy-floor",
  "#layer-figures", 
  "#layer-terrace",
  "#name-line"], { opacity: 0, y: 24 });

const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
tl.to("#layer-moon", {
  opacity: 1,

  .to("#layer-tree-trunks", { opacity: 0.82, y: 0, duration: 0.9 }, "-=0.9")
  .to("#layer-trees",     { opacity: 0.95, y: 0, duration: 1.1 }, "-=0.85")
  .to("#layer-bushes",    { opacity: 1, y: 0, duration: 1 }, "-=0.8")
  .to("#layer-palms",     { opacity: 1, y: 0, duration: 1 }, "-=0.8")
  .to("#layer-lamps",     { opacity: 1, y: 0, duration: 0.9 }, "-=0.6")
  .to("#layer-terrace",   { opacity: 1, y: 0, duration: 1 }, "-=0.8")
  .to("#layer-canopy", {

}, "-=0.7")
.to("#layer-canopy-floor", {

}, "-=0.7")
  .to("#layer-figures",   { opacity: 0.9, y: 0, duration: 0.8 }, "-=0.5")
  .to("#eyebrow",         { opacity: 1, duration: 0.9 }, "-=0.6")

/* ---------- Parallax on pointer / device tilt ---------- */
const layers = [
  { el: document.getElementById('layer-city'),      depth: 3 },
  { el: document.getElementById('layer-buildings'), depth: 6 },
  { el: document.getElementById('layer-trees'),     depth: 12 },
  { el: document.getElementById('layer-bushes'),    depth: 16 },
  { el: document.getElementById('layer-palms'),     depth: 17 },
  { el: document.getElementById('layer-lamps'),     depth: 15 },
  { el: document.getElementById('layer-canopy'),    depth: 20 },
  { el: document.getElementById('layer-figures'),   depth: 20 },
  { el: document.getElementById('layer-terrace'),   depth: 4 },
];

let targetX = 0, curX = 0;
window.addEventListener('mousemove', (e) => {
  targetX = (e.clientX / window.innerWidth - 0.5) * 2; // -1..1
});

gsap.ticker.add(() => {
  curX += (targetX - curX) * 0.06;
  layers.forEach(l => {
    gsap.set(l.el, { x: curX * l.depth });
  });
});

/* ---------- Countdown logic ---------- */
const els = {
  days: document.getElementById('num-days'),
  hours: document.getElementById('num-hours'),
  mins: document.getElementById('num-mins'),
  secs: document.getElementById('num-secs'),
};
const pad = n => String(Math.max(0, n)).padStart(2, '0');

function flipTo(el, value) {
  if (el.textContent === value) return;
  gsap.to(el, {
    y: -10, opacity: 0, duration: 0.18, ease: "power2.in",
    onComplete: () => {
      el.textContent = value;
      gsap.fromTo(el, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power2.out" });
    }
  });
}

function tick() {
  const now = new Date();
  let diff = Math.max(0, TARGET_DATE - now);

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  flipTo(els.days, pad(d));
  flipTo(els.hours, pad(h));
  flipTo(els.mins, pad(m));
  flipTo(els.secs, pad(s));

  if (TARGET_DATE - now <= 0) {
    document.getElementById('eyebrow').textContent = "today";
  }
}
tick();
setInterval(tick, 1000);
</script>
